
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineMatch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <h1>🎬 CineMatch</h1>
        <p>Filmes e séries que combinam com você!</p>
    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">

        <!-- PERFIL -->
        <section class="card">

            <h2>👤 Meu Perfil</h2>

            <div id="perfil">
                <p>
                    <strong>Nome:</strong>
                    <span id="nome-usuario">Não informado</span>
                </p>

                <p>
                    <strong>Idade:</strong>
                    <span id="idade-usuario">Não informado</span>
                </p>

                <p>
                    <strong>Gêneros favoritos:</strong>
                    <span id="generos-usuario">Não informado</span>
                </p>
            </div>

        </section>


        <!-- MENU -->
        <section class="card">

            <h2>🎬 Menu</h2>

            <div class="menu">

                <button id="btn-perfil">
                    👤 Meu Perfil
                </button>

                <button id="btn-catalogo">
                    🎞️ Catálogo
                </button>

                <button id="btn-buscar">
                    🔎 Buscar Conteúdo
                </button>

                <button id="btn-compatibilidade">
                    ❤️ Compatibilidade
                </button>

                <button id="btn-recomendacao">
                    ⭐ Melhor Recomendação
                </button>

                <button id="btn-titulos">
                    📋 Listar Títulos
                </button>

                <button id="btn-idade">
                    🔞 Verificar Conteúdos Permitidos
                </button>

            </div>

        </section>


        <!-- ÁREA DE BUSCA -->
        <section class="card">

            <h2>🔎 Buscar Conteúdo</h2>

            <div class="busca">

                <input
                    type="text"
                    id="campo-busca"
                    placeholder="Digite o título..."
                >

                <button id="btn-pesquisar">
                    Pesquisar
                </button>

            </div>

        </section>


        <!-- RESULTADOS -->
        <section class="card">

            <h2>📺 Resultado</h2>

            <div id="resultado">

                <p>
                    Escolha uma opção no menu para começar.
                </p>

            </div>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer class="rodape">

        <p>
            🎬 CineMatch © 2026
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
